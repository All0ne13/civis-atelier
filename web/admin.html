<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Civis Atelier — Admin</title><link rel="stylesheet" href="/admin.css"><script defer src="/runtime.js"></script><script defer src="/bootstrap.js"></script></head><body><header><a href="/">Civis Atelier</a><span>Управління магазином</span><button id="logout" hidden>Вийти</button></header><main id="main"><p id="status" role="status">Перевіряємо доступ…</p><div id="sign-in"></div><section id="workspace" hidden><div class="toolbar"><h1>Товари</h1><input id="search" type="search" placeholder="Знайти товар" aria-label="Знайти товар"><button id="categories">Додати категорію</button><button id="create" class="primary">Додати товар</button></div><div class="table-wrap"><table><thead><tr><th>Товар</th><th>Категорія</th><th>Ціна, USD</th><th>Залишок</th><th>Статус</th><th></th></tr></thead><tbody id="products"></tbody></table></div></section></main><dialog id="editor"><form id="product-form"><div class="toolbar"><h2 id="editor-title">Товар</h2><button type="button" id="close">Закрити</button></div><div class="fields"><label>ID / URL<input name="id" required pattern="[a-z0-9]+(-[a-z0-9]+)*"></label><label>Назва (EN)<input name="name" required maxlength="160"></label><label>Назва (УКР)<input name="nameUk" required maxlength="160"></label><label>Категорія<select name="category" required></select></label><label>Колекція<select name="collection"><option>Men</option><option>Women</option><option>Kids</option></select></label><label>Ціна, USD<input name="price" type="number" min="0" max="1000000" step="0.01" required></label><label>Залишок, шт.<input name="stock" type="number" min="0" max="1000000" step="1" required></label><label>Розміри через кому<input name="sizes" placeholder="XS, S, M, L" required></label><label class="wide">Опис (EN)<textarea name="description" required maxlength="5000"></textarea></label><label class="wide">Опис (УКР)<textarea name="descriptionUk" required maxlength="5000"></textarea></label><label class="check"><input type="checkbox" name="isNew"> Новинка</label><label class="check"><input type="checkbox" name="published"> Показувати в магазині</label></div><h3>Кольори та фотографії</h3><p>Для кожного кольору потрібне фото спереду. Завантажуйте PNG, JPEG або WebP до 4 МБ.</p><div id="color-rows"></div><button type="button" id="add-color">Додати колір</button><p id="form-error" role="alert"></p><div class="toolbar bottom"><button class="primary" id="save" type="submit">Зберегти</button><span>Зміни зберігаються в базі магазину.</span></div></form></dialog></body></html>
